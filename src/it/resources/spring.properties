# Raise the Spring TestContext application-context cache above its default of 32. The integration
# suite has more distinct @SpringBootTest contexts than that, so LRU eviction was thrashing — and
# evicting/recreating the RANDOM_PORT MCP server context (McpServerEndpointsIT) left it poisoned
# (400 on the JSON-RPC handshake). Holding all IT contexts avoids the churn. See docs/testing-plan.md.
spring.test.context.cache.maxSize=64
