server:
  port: 8080
  forward-headers-strategy: framework
  servlet:
    session:
      cookie:
        # SEC-14: block the session cookie from riding along on cross-site requests (CSRF defence
        # for the CSRF-disabled API chains) and from JavaScript. 'lax' (not 'strict') is required so
        # the OAuth2 login redirect back from the IdP still carries the session. The Secure flag is
        # applied automatically by the container when the request is HTTPS (prod runs behind a
        # TLS-terminating proxy with forward-headers-strategy=framework), so it is left to that
        # mechanism rather than hardcoded — which would break plain-HTTP local development.
        same-site: lax
        http-only: true

spring:
  application:
    name: yvoke
  autoconfigure:
    exclude:
      - org.springframework.ai.model.openai.autoconfigure.OpenAiAudioSpeechAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiAudioTranscriptionAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiImageAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiChatAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiEmbeddingAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiModerationAutoConfiguration
  threads:
    virtual:
      enabled: true
  servlet:
    multipart:
      max-file-size: 200MB
      max-request-size: 200MB
  security:
    oauth2:
      client:
        registration:
          entra:
            client-id: ${ENTRA_CLIENT_ID:placeholder-client-id}
            client-secret: ${ENTRA_CLIENT_SECRET:placeholder-client-secret}
            scope:
              - openid
              - profile
              - email
              - offline_access
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            provider: entra
        provider:
          entra:
            authorization-uri: https://login.microsoftonline.com/${ENTRA_TENANT_ID:common}/oauth2/v2.0/authorize
            token-uri: https://login.microsoftonline.com/${ENTRA_TENANT_ID:common}/oauth2/v2.0/token
            jwk-set-uri: https://login.microsoftonline.com/${ENTRA_TENANT_ID:common}/discovery/v2.0/keys
            user-info-uri: https://graph.microsoft.com/oidc/userinfo
            user-name-attribute: sub
      resourceserver:
        jwt:
          jwk-set-uri: https://login.microsoftonline.com/${ENTRA_TENANT_ID:common}/discovery/v2.0/keys
          issuer-uri: https://login.microsoftonline.com/${ENTRA_TENANT_ID:common}/v2.0
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/postgres}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    type: com.zaxxer.hikari.HikariDataSource
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000
      # Cap any single statement so a pathological query/lock-wait cannot hold a pooled connection
      # indefinitely (the pool is shared by web, worker, and MCP traffic).
      connection-init-sql: "SET statement_timeout = '60s'"
  ai:
    model:
      chat: none
      embedding: none
    mcp:
      server:
        enabled: true
        name: "Yvoke"
        # Substituted at build time by the Spring Boot parent's resource filtering, which uses @
        # as its ONLY delimiter for application*.yml — so this is the correct token and
        # ${project.version} would NOT be substituted (it would reach Spring's runtime resolver
        # instead and fail there). Quoting is mandatory: YAML treats a leading @ as reserved.
        # This is the only version an external MCP client is ever told, and it was previously a
        # hardcoded literal that had already drifted from the pom.
        version: "@project.version@"
        protocol: STREAMABLE
        stdio: false
        streamable-http:
          mcp-endpoint: "/mcp"
        annotation-scanner:
          enabled: false
        capabilities:
          tool: true
          prompt: true

management:
  server:
    port: 9090
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      show-details: when-authorized
  info:
    git:
      # /actuator/info is anonymous, and the build-info contributor deliberately publishes
      # group/artifact/version/time there. The git contributor is a different matter: it is
      # ENABLED by default, so the moment a git.properties reaches the classpath (which is what
      # git-commit-id-maven-plugin exists to do) the same anonymous endpoint would also serve the
      # branch and commit — and with mode=full, the build host and the committer's email. What
      # the build IS may be disclosed; where it was built may not.
      enabled: false
app:
  upload-dir: ${APP_UPLOADS_DIR:uploads}
  security:
    mock: ${APP_SECURITY_MOCK:false}
    api-key: ${APP_SECURITY_API_KEY:dev-key-12345}
    # Key for at-rest encryption of stored secrets (e.g. the Confluence API token). When unset,
    # secrets are stored in plaintext (a warning is logged at startup). Set in all real environments.
    secret-key: ${APP_SECRET_KEY:}
    # Per-deployment KDF salt (hex). SEC-15: there is deliberately NO shared default — every
    # environment that sets a secret-key must also set its own APP_SECRET_SALT. Changing it (or the
    # key) invalidates previously encrypted secrets, which must then be re-encrypted.
    secret-salt: ${APP_SECRET_SALT:}
    roles:
      admin-claim: ${APP_SECURITY_ADMIN_CLAIM:Admin}
      user-claim: ${APP_SECURITY_USER_CLAIM:User}
    mcp:
      allowed-audience: ${APP_SECURITY_MCP_AUDIENCE:api://oim-kb}
      required-scope: ${APP_SECURITY_MCP_SCOPE:api://oim-kb/mcp.read}
      resource-url: ${APP_SECURITY_MCP_RESOURCE_URL:http://localhost:8080/mcp}
      authorization-server-url: ${APP_SECURITY_MCP_AUTHORIZATION_SERVER_URL:https://login.microsoftonline.com/${ENTRA_TENANT_ID:common}/v2.0}
  ai:
    # One of: gemini, azure-openai-responses.
    #
    # 'cloudflare-gemini', 'openrouter' and 'azure-openai' are RETIRED: LlmConfig rejects them at
    # startup rather than letting them reach the unknown-value fallback, which answers with Gemini
    # on a Gemini key and logs the operator's own spelling back at them. All three classes, their
    # tests and the settings below are deliberately left in place, so re-enabling any of them is a
    # branch in LlmConfig plus an entry in LlmRouteId. Note that retiring cloudflare-gemini gives up
    # the AI Gateway's response cache, its cf-aig-metadata attribution and the cost_avoided figures
    # derived from cache hits.
    provider: ${AI_PROVIDER:gemini}
    # Per-model overrides as a JSON object, e.g.
    #   AI_MODEL_ROUTES={"gemini-3.6-flash": "gemini", "gpt-5.6-luna": "azure-openai-responses"}
    # A model with no entry is answered by `provider` above; blank or {} means every model is.
    # One string rather than a nested map because the deployment delivers configuration as flat
    # environment variables (envFrom over a ConfigMap), where a nested structure cannot be set at
    # all. JSON rather than the comma-separated style used by `reasoning-models` because a model
    # name is operator-chosen free text — quoting settles what a separator inside one would mean.
    # Everything it DOES contain is validated at startup: invalid JSON, a non-object, an unknown
    # route, a non-string route and a model mapped twice all fail, because each of those answers a
    # model with the wrong provider rather than erroring.
    model-routes: ${AI_MODEL_ROUTES:}
    # Retired — not selectable; see the note on `provider` above.
    openrouter:
      base-url: ${OPENROUTER_BASE_URL:https://openrouter.ai/api/v1}
      api-key: ${OPENROUTER_API_KEY:placeholder-openrouter-api-key}
    gemini:
      base-url: ${GEMINI_API_BASE:https://generativelanguage.googleapis.com}
      api-key: ${GEMINI_API_KEY:${GOOGLE_API_KEY:placeholder-gemini-api-key}}
      enable-thinking: true
      thinking-level: ${GEMINI_THINKING_LEVEL:medium}
    # Retired — not selectable; see the note on `provider` above.
    cloudflare-gemini:
      account-id: ${CLOUDFLARE_ACCOUNT_ID:placeholder-cf-account-id}
      gateway-id: ${CLOUDFLARE_GATEWAY_ID:placeholder-cf-gateway-id}
      gateway-token: ${CLOUDFLARE_GATEWAY_TOKEN:placeholder-cf-gateway-token}
      api-key: ${GEMINI_API_KEY:${GOOGLE_API_KEY:placeholder-gemini-api-key}}
      enable-thinking: true
      thinking-level: ${GEMINI_THINKING_LEVEL:medium}
    azure-openai:
      endpoint: ${AZURE_OPENAI_ENDPOINT:placeholder-azure-openai-endpoint}
      api-key: ${AZURE_OPENAI_API_KEY:placeholder-azure-openai-api-key}
      enable-thinking: true
      thinking-level: ${AZURE_OPENAI_THINKING_LEVEL:medium}
      # Deployment names that address a reasoning model, when the deployment is not named after the
      # model it serves. Leave empty to detect from the name.
      reasoning-models: ${AZURE_OPENAI_REASONING_MODELS:}
    rag:
      max-iterations: ${APP_AI_RAG_MAX_ITERATIONS:20}
      max-tokens: 16384
      temperature: 0.0
      default-prompt-name: ${RAG_DEFAULT_PROMPT_NAME:default-chat}
      thinking-level: ${RAG_THINKING_LEVEL:medium}
    kg:
      model: ${KG_MODEL:gemini-3.1-flash-lite}
      max-tokens: 4096
      temperature: 0.0
      concurrency: ${KG_CONCURRENCY:8}
      max-attempts: ${KG_MAX_ATTEMPTS:2}
      thinking-level: ${KG_THINKING_LEVEL:low}
    summarize:
      model: ${SUMMARIZE_MODEL:gemini-3.1-flash-lite}
      max-tokens: 1000
      temperature: 0.2
      concurrency: ${SUMMARIZE_CONCURRENCY:8}
      thinking-level: ${SUMMARIZE_THINKING_LEVEL:low}
    embedding:
      base-url: ${VOYAGE_API_BASE:https://api.voyageai.com/v1}
      api-key: ${VOYAGE_API_KEY:placeholder-voyage-api-key}
      model: ${EMBEDDING_MODEL:voyage-4-large}
    ranking:
      base-url: ${VOYAGE_API_BASE:https://api.voyageai.com/v1}
      api-key: ${VOYAGE_API_KEY:placeholder-voyage-api-key}
      model: ${RERANK_MODEL:rerank-2.5}
    orchestrator:
      # The effective limits for a run come from the orchestrator_profiles ROW; these apply when a
      # profile does not set them, and they are what the admin form is pre-filled with. They live
      # here rather than as literals in the controller and the template because that is exactly how
      # they drifted: the limit was raised to 3 in OrchestratorProperties and stayed 2 in three
      # other places, so a profile created through the form silently got the old value.
      # ApplicationYamlInvariantsTest pins these against the record's own fallbacks.
      #
      # 3 rather than 2 (zero-based, so four attempts): a reviewer restricted to the sources an
      # answer cites rejects mis-citations that a whole-evidence reviewer used to excuse by finding
      # the fact elsewhere, so rejections became more frequent AND more mechanical. A live run was
      # still converging when it ran out of rounds and was delivered flagged despite being nearly
      # correct. The extra round is cheap now that a citation-only revision cannot delegate.
      max-review-rounds: 3
      max-specialist-calls: 8
  retrieval:
    default-limit: 10
    # Ceiling on rows returned by any search. Both candidate pools are derived from the
    # requested limit, and the reranker receives every fused candidate in one request, so this
    # is what bounds that request. Measured traffic: 269 of 330 logged searches ran at 10, the
    # largest ever was 50.
    max-limit: 20
    log-query-max-chars: 200
    # Over-fetch multipliers, applied to (limit + offset) per lane. A fixed BM25 cap stopped
    # being an over-fetch at large pages — at a page of 30 the old cap of 30 made the pool equal
    # to the page, leaving the reranker nothing to select from. 3.0 reproduces the previous
    # pool of 30 at the default limit of 10 and only adds headroom above it.
    semantic-limit-multiplier: 1.5
    fulltext-limit-multiplier: 3.0
    rrf:
      k: 60
      semantic-weight: 1.0
      fulltext-weight: 1.0
  worker:
    # Background ingestion job worker (M10). Concurrency default 4 is the proven-safe number.
    enabled: true
    concurrency: 4
    poll-interval: 2s
  confluence:
    # Backoff for the Confluence body fetch: a full-space crawl issues one request per page at
    # `app.worker.concurrency`, so HTTP 429 is expected. `Retry-After` wins when the server sends
    # it, capped by max-backoff-ms so a hostile/large value cannot park a worker thread.
    retry:
      max-attempts: ${APP_CONFLUENCE_RETRY_MAX_ATTEMPTS:4}
      initial-backoff-ms: ${APP_CONFLUENCE_RETRY_INITIAL_BACKOFF_MS:1000}
      max-backoff-ms: ${APP_CONFLUENCE_RETRY_MAX_BACKOFF_MS:30000}
  # SEC-03: per-principal token-bucket rate limiting for the generation/ingest endpoints. Each
  # principal may make up to `capacity` such requests per `refill-period-seconds` before receiving 429.
  rate-limit:
    enabled: ${APP_RATE_LIMIT_ENABLED:true}
    capacity: ${APP_RATE_LIMIT_CAPACITY:20}
    refill-period-seconds: ${APP_RATE_LIMIT_REFILL_SECONDS:60}
  generation:
    # PRF-15: app-wide cap on concurrently-running SSE generations. Excess requests get 429 until a
    # slot frees. Set to 0 to disable.
    max-concurrent: ${APP_GENERATION_MAX_CONCURRENT:64}
  chat:
    enabled: ${APP_CHAT_ENABLED:true}
    # The model picker, and the per-request whitelist. ORDER IS BEHAVIOUR: element 0 is
    # stamped on every new conversation and is the model the playbook preflight runs
    # against. The Azure deployments only answer where AZURE_OPENAI_ENDPOINT / _API_KEY are
    # set AND app.ai.model-routes maps them; without a route they reach the default route
    # (Gemini), which rejects the name at call time.
    allowed-models: "${ALLOWED_MODELS:gemini-3.7-flash,gemini-3.6-flash,gemini-3.5-flash-lite,gpt-5.4-mini,DeepSeek-V4-Flash,gpt-5.6-luna}"
    playbook-validation-enabled: ${APP_CHAT_PLAYBOOK_VALIDATION_ENABLED:true}
    cost-explorer:
      # PRF-01: hard row cap for the per-call/per-message cost-explorer views so a wide time range
      # cannot materialize the entire llm_call_logs table into heap.
      max-rows: ${APP_CHAT_COST_EXPLORER_MAX_ROWS:5000}

rest-client:
  connect-timeout-ms: 10000
  read-timeout-ms: 600000

logging:
  level:
    root: INFO
    "[de.palsoftware.yvoke]": INFO
