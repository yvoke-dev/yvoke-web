<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:fragment="header(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title} + ' — Yvoke - Chat'">Yvoke - Chat</title>
    <link rel="icon" type="image/png" sizes="32x32" th:href="@{/images/logo-32.png}">
    <link rel="icon" type="image/png" sizes="16x16" th:href="@{/images/logo-16.png}">
    <link rel="stylesheet" th:href="@{/css/index.css}">
    <!-- CSRF token: forms get the hidden field automatically; fetch/htmx read it from here -->
    <meta name="_csrf" th:content="${_csrf?.token}">
    <meta name="_csrf_header" th:content="${_csrf?.headerName}">
    <script th:inline="none">
      (function () {
        var tokenEl = document.querySelector('meta[name="_csrf"]');
        var headerEl = document.querySelector('meta[name="_csrf_header"]');
        if (!tokenEl || !headerEl || !tokenEl.content || !headerEl.content) return;
        var token = tokenEl.content, header = headerEl.content;
        document.addEventListener('htmx:configRequest', function (e) { e.detail.headers[header] = token; });
        var originalFetch = window.fetch;
        window.fetch = function (input, init) {
          init = init || {};
          var method = (init.method || (input && input.method) || 'GET').toUpperCase();
          if (method !== 'GET' && method !== 'HEAD') {
            var headers = new Headers(init.headers || {});
            if (!headers.has(header)) headers.set(header, token);
            init.headers = headers;
          }
          return originalFetch.call(this, input, init);
        };
      })();
    </script>
    <!-- Markdown renderer + HTML sanitizer (self-hosted; all rendered markdown is sanitized before innerHTML) -->
    <script th:src="@{/js/marked.min.js}"></script>
    <script th:src="@{/js/purify.min.js}"></script>
    <!-- Mermaid renderer -->
    <script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
    <!-- KaTeX for LaTeX math rendering -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" integrity="sha384-nB0miv6/jRmo5UMMR1wu3Gz6NLsoTkbqJghGIsx//Rlm+ZU03BU6SQNC66uf4l5+" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js" integrity="sha384-7zkQWkzuo3B5mTepMUcHkMB5jZaolc2xDwL6VFqjFALcbeS9Ggm/Yr2r3Dy4lfFg" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js" integrity="sha384-43gviWU0YVjaDtb/GhzOouOXtZMP/7XUzwPTstBeZFe/+rCMvRwr4yROQP43s0Xk" crossorigin="anonymous"></script>
    <!-- HTMX CDN -->
    <!-- htmx 2.0.0, vendored. Not a CDN reference because thread.js calls htmx.process()
         unconditionally when an answer finalizes, so an unreachable CDN is an uncaught TypeError,
         not a graceful degradation (unlike mermaid/KaTeX below, which are feature-detected). -->
    <script th:src="@{/js/htmx.min.js}"></script>
</head>
<body>
    <div class="chat-layout">
        <!-- Sidebar Navigation -->
        <aside class="chat-sidebar" th:fragment="sidebar">
            <div class="sidebar-header">
                <a th:href="@{/chat}" class="sidebar-logo">
                    <img th:src="@{/images/logo-48.png}" alt="Yvoke Logo" style="width: 28px; height: 28px;" />
                    <span class="sidebar-logo-text">Yvoke - Chat</span>
                </a>
            </div>
            
            <div class="new-chat-container">
                <form th:action="@{/chat/new}" method="post">
                    <button type="submit" class="btn btn-primary new-chat-btn">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="12" y1="5" x2="12" y2="19"></line>
                            <line x1="5" y1="12" x2="19" y2="12"></line>
                        </svg>
                        New Chat
                    </button>
                </form>
            </div>
            
            <div class="conversations-list">
                <div th:if="${(folders == null || folders.isEmpty()) && (untagged == null || untagged.isEmpty())}" class="no-conversations">
                    No conversations yet
                </div>
                
                <!-- Public Conversations Folder -->
                <details th:if="${(publicFolders != null && !publicFolders.isEmpty()) || (publicUntagged != null && !publicUntagged.isEmpty())}" 
                         class="folder-details public-conversations-details" 
                         name="sidebar-folders"
                         th:open="${conversation != null && conversation.tags != null && conversation.tags.contains('public')}">
                    <summary class="folder-summary">
                        <span class="folder-title-container">
                            <svg class="chevron-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <polyline points="9 18 15 12 9 6"></polyline>
                            </svg>
                            <svg class="folder-icon public-folder-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <circle cx="12" cy="12" r="10"></circle>
                                <line x1="2" y1="12" x2="22" y2="12"></line>
                                <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path>
                            </svg>
                            <span class="folder-name">Public Conversations</span>
                        </span>
                        <span class="folder-count" th:text="${publicCount}">0</span>
                    </summary>
                    <div class="folder-content" style="padding-left: 1rem;">
                        <!-- public folders -->
                        <details th:each="entry : ${publicFolders}" class="folder-details"
                                 name="public-subfolders"
                                 th:open="${conversation != null && conversation.tags != null && conversation.tags.contains('public') && (conversation.tags.?[#this != 'public'].isEmpty() ? null : conversation.tags.?[#this != 'public'].get(0)) == entry.key}">
                            <summary class="folder-summary">
                                <span class="folder-title-container">
                                    <svg class="chevron-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                        <polyline points="9 18 15 12 9 6"></polyline>
                                    </svg>
                                    <svg class="folder-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                        <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path>
                                    </svg>
                                    <span class="folder-name" th:text="${entry.key}">Tag Name</span>
                                </span>
                                <span class="folder-count" th:text="${entry.value.size()}">0</span>
                            </summary>
                            <div class="folder-content">
                                <div th:each="conv : ${entry.value}" class="conversation-item public-item" th:classappend="${conversation != null && conversation.id == conv.id ? 'active' : ''}">
                                    <a th:href="@{/chat/{id}(id=${conv.id})}" class="conversation-link">
                                        <div class="conversation-title" style="display: flex; align-items: center; gap: 0.25rem;">
                                            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0; color: var(--color-accent-blue, #3b82f6);">
                                                <circle cx="12" cy="12" r="10"></circle>
                                                <line x1="2" y1="12" x2="22" y2="12"></line>
                                                <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path>
                                            </svg>
                                            <span th:text="${conv.title}">Conversation Title</span>
                                        </div>
                                        <div class="conversation-date" style="display: flex; justify-content: space-between; align-items: center;">
                                     <span th:text="${#temporals.format(conv.createdAt, 'dd.MM.yyyy HH:mm') + ' UTC'}">Date</span>
                                     <span class="badge" th:classappend="${conv.source == 'desktop' ? 'badge-info' : 'badge-muted'}" style="font-size: 0.6rem; padding: 0.1rem 0.35rem; text-transform: capitalize; border-radius: 4px;" th:text="${conv.source}">web</span>
                                 </div>
                                    </a>
                                    <form th:if="${conv.userId == currentUserId}" th:action="@{/chat/{id}/delete(id=${conv.id})}" method="post" class="delete-conv-form" onsubmit="return confirm('Delete this conversation?');">
                                        <button type="submit" class="delete-conv-btn" title="Delete conversation">
                                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                                <polyline points="3 6 5 6 21 6"></polyline>
                                                <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                                            </svg>
                                        </button>
                                    </form>
                                </div>
                            </div>
                        </details>

                        <!-- public untagged -->
                        <div th:each="conv : ${publicUntagged}" class="conversation-item public-item" th:classappend="${conversation != null && conversation.id == conv.id ? 'active' : ''}">
                            <a th:href="@{/chat/{id}(id=${conv.id})}" class="conversation-link">
                                <div class="conversation-title" style="display: flex; align-items: center; gap: 0.25rem;">
                                    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0; color: var(--color-accent-blue, #3b82f6);">
                                        <circle cx="12" cy="12" r="10"></circle>
                                        <line x1="2" y1="12" x2="22" y2="12"></line>
                                        <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path>
                                    </svg>
                                    <span th:text="${conv.title}">Conversation Title</span>
                                </div>
                                <div class="conversation-date" style="display: flex; justify-content: space-between; align-items: center;">
                                     <span th:text="${#temporals.format(conv.createdAt, 'dd.MM.yyyy HH:mm') + ' UTC'}">Date</span>
                                     <span class="badge" th:classappend="${conv.source == 'desktop' ? 'badge-info' : 'badge-muted'}" style="font-size: 0.6rem; padding: 0.1rem 0.35rem; text-transform: capitalize; border-radius: 4px;" th:text="${conv.source}">web</span>
                                 </div>
                            </a>
                            <form th:if="${conv.userId == currentUserId}" th:action="@{/chat/{id}/delete(id=${conv.id})}" method="post" class="delete-conv-form" onsubmit="return confirm('Delete this conversation?');">
                                <button type="submit" class="delete-conv-btn" title="Delete conversation">
                                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                        <polyline points="3 6 5 6 21 6"></polyline>
                                        <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                                    </svg>
                                </button>
                            </form>
                        </div>
                    </div>
                </details>

                <!-- Tag Folders -->
                <details th:each="entry : ${folders}" class="folder-details" 
                         name="sidebar-folders"
                         th:open="${conversation != null && conversation.tags != null && !conversation.tags.contains('public') && (!conversation.tags.isEmpty() ? conversation.tags.get(0) : null) == entry.key}">
                    <summary class="folder-summary">
                        <span class="folder-title-container">
                            <svg class="chevron-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <polyline points="9 18 15 12 9 6"></polyline>
                            </svg>
                            <svg class="folder-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path>
                            </svg>
                            <span class="folder-name" th:text="${entry.key}">Tag Name</span>
                        </span>
                        <span class="folder-count" th:text="${entry.value.size()}">0</span>
                    </summary>
                    <div class="folder-content">
                        <div th:each="conv : ${entry.value}" class="conversation-item" th:classappend="${conversation != null && conversation.id == conv.id ? 'active' : ''}">
                            <a th:href="@{/chat/{id}(id=${conv.id})}" class="conversation-link">
                                <div class="conversation-title" th:text="${conv.title}">Conversation Title</div>
                                <div class="conversation-date" style="display: flex; justify-content: space-between; align-items: center;">
                                    <span th:text="${#temporals.format(conv.createdAt, 'dd.MM.yyyy HH:mm') + ' UTC'}">Date</span>
                                    <span class="badge" th:classappend="${conv.source == 'desktop' ? 'badge-info' : 'badge-muted'}" style="font-size: 0.6rem; padding: 0.1rem 0.35rem; text-transform: capitalize; border-radius: 4px;" th:text="${conv.source}">web</span>
                                </div>
                            </a>
                            <form th:action="@{/chat/{id}/delete(id=${conv.id})}" method="post" class="delete-conv-form" onsubmit="return confirm('Delete this conversation?');">
                                <button type="submit" class="delete-conv-btn" title="Delete conversation">
                                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                        <polyline points="3 6 5 6 21 6"></polyline>
                                        <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                                    </svg>
                                </button>
                            </form>
                        </div>
                    </div>
                </details>

                <!-- No Tag Folder -->
                <details th:if="${untagged != null && !untagged.isEmpty()}" class="folder-details" 
                         name="sidebar-folders"
                         th:open="${conversation == null || conversation.tags == null || conversation.tags.isEmpty()}">
                    <summary class="folder-summary">
                        <span class="folder-title-container">
                            <svg class="chevron-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <polyline points="9 18 15 12 9 6"></polyline>
                            </svg>
                            <svg class="folder-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path>
                            </svg>
                            <span class="folder-name">No Tag</span>
                        </span>
                        <span class="folder-count" th:text="${untagged.size()}">0</span>
                    </summary>
                    <div class="folder-content">
                        <div th:each="conv : ${untagged}" class="conversation-item" th:classappend="${conversation != null && conversation.id == conv.id ? 'active' : ''}">
                            <a th:href="@{/chat/{id}(id=${conv.id})}" class="conversation-link">
                                <div class="conversation-title" th:text="${conv.title}">Conversation Title</div>
                                <div class="conversation-date" style="display: flex; justify-content: space-between; align-items: center;">
                                    <span th:text="${#temporals.format(conv.createdAt, 'dd.MM.yyyy HH:mm') + ' UTC'}">Date</span>
                                    <span class="badge" th:classappend="${conv.source == 'desktop' ? 'badge-info' : 'badge-muted'}" style="font-size: 0.6rem; padding: 0.1rem 0.35rem; text-transform: capitalize; border-radius: 4px;" th:text="${conv.source}">web</span>
                                </div>
                            </a>
                            <form th:action="@{/chat/{id}/delete(id=${conv.id})}" method="post" class="delete-conv-form" onsubmit="return confirm('Delete this conversation?');">
                                <button type="submit" class="delete-conv-btn" title="Delete conversation">
                                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                        <polyline points="3 6 5 6 21 6"></polyline>
                                        <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                                    </svg>
                                </button>
                            </form>
                        </div>
                    </div>
                </details>
            </div>
            
            <div sec:authorize="hasRole('ADMIN')" class="admin-switch-container">
                <a th:href="@{/admin/documents}" class="btn btn-primary admin-switch-btn">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                        <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                    </svg>
                    Go to Admin Console
                </a>
            </div>
            
            <!-- User Profile & Sign Out -->
            <div class="user-profile-footer">
                <div class="user-info">
                    <span class="user-name" th:text="${@userService.getCurrentUserDisplayName()}">User Name</span>
                    <span class="user-role-badge">
                        <span sec:authorize="hasRole('ADMIN')">Admin</span>
                        <span sec:authorize="!hasRole('ADMIN') and hasRole('USER')">User</span>
                    </span>
                </div>
                <form th:action="@{/logout}" method="post" class="logout-form">
                    <button type="submit" class="logout-btn" title="Sign Out">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                            <polyline points="16 17 21 12 16 7"></polyline>
                            <line x1="21" y1="12" x2="9" y2="12"></line>
                        </svg>
                    </button>
                </form>
            </div>
            <!-- Datalist for tag autocomplete -->
            <datalist id="all-tags-list">
                <option th:each="t : ${allTags}" th:value="${t}" th:text="${t}"></option>
            </datalist>
        </aside>
    </div>
</body>
</html>
