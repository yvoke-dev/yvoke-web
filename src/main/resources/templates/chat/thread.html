<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{chat/layout :: header(${conversation.title})}"></head>
<body>
    <div class="chat-layout">
        <!-- Sidebar -->
        <aside th:replace="~{chat/layout :: sidebar}"></aside>

        <!-- Main Chat Area -->
        <div class="chat-main-thread">
            <!-- Header bar -->
            <header class="chat-thread-header">
                <div class="chat-thread-left">
                    <div class="chat-thread-info">
                        <div style="display: flex; align-items: center; gap: 0.5rem; flex-wrap: wrap;">
                            <h2 class="chat-thread-title" th:text="${conversation.title}">New Conversation</h2>
                            <span class="badge" th:classappend="${conversation.source == 'desktop' ? 'badge-info' : 'badge-muted'}" style="text-transform: capitalize; padding: 0.15rem 0.5rem; font-size: 0.75rem; border-radius: 4px;" th:text="${conversation.source}">web</span>
                            <span th:if="${conversation.userId != currentUserId}" class="public-badge" style="background-color: rgba(59, 130, 246, 0.15); color: var(--color-accent-blue, #3b82f6); font-size: 0.75rem; padding: 0.15rem 0.4rem; border-radius: 4px; display: inline-flex; align-items: center; gap: 0.25rem; font-weight: 500; border: 1px solid rgba(59, 130, 246, 0.3);">
                                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0;">
                                    <circle cx="12" cy="12" r="10"></circle>
                                    <line x1="2" y1="12" x2="22" y2="12"></line>
                                    <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path>
                                </svg>
                                Shared
                            </span>
                        </div>
                        <span class="chat-thread-meta" th:text="'Created: ' + ${#temporals.format(conversation.createdAt, 'dd.MM.yyyy HH:mm') + ' UTC'}">Date</span>
                    </div>
                    <div class="chat-thread-tags">
                        <span th:each="tag : ${conversation.tags}" class="tag-badge">
                            <span class="tag-text" th:text="${tag}">tag</span>
                            <form th:if="${!isReadOnly}" th:action="@{/chat/{id}/tags/remove(id=${conversation.id})}" method="post" class="remove-tag-form">
                                <input type="hidden" name="tag" th:value="${tag}" />
                                <button type="submit" class="remove-tag-btn" title="Remove tag">&times;</button>
                            </form>
                        </span>
                        
                        <!-- Add Tag Form -->
                        <form th:if="${!isReadOnly}" th:action="@{/chat/{id}/tags/add(id=${conversation.id})}" method="post" class="add-tag-form">
                            <input type="text" name="tag" placeholder="Add tag..." list="all-tags-list" class="add-tag-input" required autocomplete="off" />
                            <button type="submit" class="add-tag-btn" title="Add tag">
                                <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                                    <line x1="12" y1="5" x2="12" y2="19"></line>
                                    <line x1="5" y1="12" x2="19" y2="12"></line>
                                </svg>
                            </button>
                        </form>
                    </div>
                </div>
                <div class="chat-thread-right" th:if="${isReadOnly}">
                    <button type="button" id="show-thinking-btn" class="chat-header-btn">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M12 5a3 3 0 1 0-5.997.125 4 4 0 0 0-2.526 5.77 4 4 0 0 0 .556 6.588A4 4 0 1 0 12 18Z"></path>
                            <path d="M12 5a3 3 0 1 1 5.997.125 4 4 0 0 1 2.526 5.77 4 4 0 0 1-.556 6.588A4 4 0 1 1 12 18Z"></path>
                            <path d="M12 5v14"></path>
                            <path d="M12 12h6"></path>
                            <path d="M12 12H6"></path>
                            <path d="M12 9h4"></path>
                            <path d="M12 9H8"></path>
                            <path d="M12 15h4"></path>
                            <path d="M12 15H8"></path>
                        </svg>
                        <span>Show thinking & tools</span>
                        <div class="custom-tooltip tooltip-bottom">Show thinking & tools (disabled)</div>
                    </button>
                </div>
            </header>

            <!-- Messages Thread -->
            <div class="chat-messages-container" id="chat-messages">
                <!-- Playbook prompt chips for empty conversations -->
                <div th:if="${#lists.isEmpty(messages) && !isReadOnly}" class="prompt-chips" id="prompt-chips">
                    <div class="chips-label">Playbooks from the knowledge base (or type "/"):</div>
                    <button th:each="prompt : ${prompts}" 
                            type="button"
                            class="chip" 
                            th:classappend="${prompt.prototype ? ' chip-prototype' : ''}"
                            th:style="${prompt.prototype && !(settings != null && (settings['show-prototypes'] == true || settings['show-prototypes'] == 'true')) ? 'display: none;' : ''}"
                            th:attr="data-prompt-name=${prompt.name}, data-prompt-title=${prompt.title}, data-prototype=${prompt.prototype}"
                            th:title="${prompt.description}"
                            th:text="${prompt.prototype ? '🧪 ' + prompt.title : prompt.title}"
                            data-action="select-playbook">
                        Prompt Title
                    </button>
                </div>

                <th:block th:each="msg : ${messages}">
                    <div th:replace="~{chat/fragments/message :: message(${msg})}"></div>
                </th:block>
            </div>

            <!-- Input Bar -->
            <div class="chat-input-container" th:style="${isReadOnly} ? 'display: none;' : 'position: relative;'">
                <!-- Autocomplete Popup -->
                <div id="autocomplete-popup" class="prompt-autocomplete" style="display: none;"></div>

                <!-- Playbook validation warning -->
                <div id="playbook-validation-warning" class="playbook-validation-warning" style="display: none;">
                    <span class="warning-icon">⚠️</span>
                    <span class="warning-text">A playbook must be selected before asking a question.</span>
                </div>

                <!-- Active playbook indicator -->
                <div id="active-playbook" class="active-playbook" style="display: none;">
                    <span class="playbook-tag" id="active-playbook-tag">📋 Playbook Title</span>
                    <span class="active-playbook-hint">applied to your next message</span>
                    <button type="button" class="active-playbook-remove" title="Remove playbook" data-action="clear-playbook">
                        &times;
                    </button>
                </div>

                <form id="chat-form" class="chat-input-form">
                    <input type="hidden" id="chat-prompt-name" name="promptName">
                    <div class="chat-input-box">
                        <textarea id="chat-input" placeholder="Ask a question… (type &quot;/&quot; or click &quot;+&quot; to select a playbook, Shift + Enter for new line, Enter to send)" class="chat-input" autocomplete="off" required></textarea>
                        <div class="chat-input-footer">
                            <div class="chat-input-footer-left">
                                <button type="button" id="action-add-btn" class="chat-input-action-btn">
                                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                        <line x1="12" y1="5" x2="12" y2="19"></line>
                                        <line x1="5" y1="12" x2="19" y2="12"></line>
                                    </svg>
                                    <div class="custom-tooltip">Select playbook</div>
                                </button>
                                <div class="chat-input-mic-group" id="voice-input-group" style="display: none; position: relative;">
                                    <button type="button" id="voice-input-btn" class="chat-input-action-btn">
                                        <svg id="mic-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                            <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"></path>
                                            <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
                                            <line x1="12" x2="12" y1="19" y2="22"></line>
                                        </svg>
                                        <div class="custom-tooltip">Start voice typing</div>
                                    </button>
                                    <button type="button" id="voice-settings-btn" class="chat-input-action-btn voice-settings-btn" style="padding: 0.25rem 0.1rem; margin-left: -4px;">
                                        <svg width="8" height="8" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                                            <polyline points="6 9 12 15 18 9"></polyline>
                                        </svg>
                                        <div class="custom-tooltip">Voice settings</div>
                                    </button>
                                    <!-- Voice Settings Dropdown -->
                                    <div id="voice-settings-dropdown" class="voice-settings-dropdown" style="display: none;">
                                        <div class="voice-settings-option">
                                            <span>Hold to record</span>
                                            <label class="voice-switch">
                                                <input type="checkbox" id="hold-to-record-toggle">
                                                <span class="voice-slider"></span>
                                            </label>
                                        </div>
                                    </div>
                                </div>
                                <button th:if="${!isReadOnly}" type="button" id="show-thinking-btn" class="chat-input-action-btn">
                                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                        <path d="M12 5a3 3 0 1 0-5.997.125 4 4 0 0 0-2.526 5.77 4 4 0 0 0 .556 6.588A4 4 0 1 0 12 18Z"></path>
                                        <path d="M12 5a3 3 0 1 1 5.997.125 4 4 0 0 1 2.526 5.77 4 4 0 0 1-.556 6.588A4 4 0 1 1 12 18Z"></path>
                                        <path d="M12 5v14"></path>
                                        <path d="M12 12h6"></path>
                                        <path d="M12 12H6"></path>
                                        <path d="M12 9h4"></path>
                                        <path d="M12 9H8"></path>
                                        <path d="M12 15h4"></path>
                                        <path d="M12 15H8"></path>
                                    </svg>
                                    <div class="custom-tooltip">Show thinking & tools</div>
                                </button>
                                <button th:if="${!isReadOnly}" type="button" id="show-prototypes-btn" class="chat-input-action-btn">
                                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                        <path d="M10 2v7.31L4.69 18.2A2 2 0 0 0 6.38 21h11.24a2 2 0 0 0 1.69-2.8L14 9.31V2"></path>
                                        <line x1="8.5" y1="2" x2="15.5" y2="2"></line>
                                        <line x1="14" y1="9.3" x2="10" y2="9.3"></line>
                                    </svg>
                                    <div class="custom-tooltip">Show prototype playbooks</div>
                                </button>
                                <button type="button" id="mode-standard-btn" class="chat-input-action-btn">
                                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
                                    </svg>
                                    <div class="custom-tooltip">Standard mode (complete response)</div>
                                </button>
                                <button type="button" id="mode-streaming-btn" class="chat-input-action-btn">
                                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                        <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon>
                                    </svg>
                                    <div class="custom-tooltip"><span class="text-danger">[Experimental]</span> Streaming mode (live tokens)</div>
                                </button>
                            </div>
                            <div class="chat-input-footer-right">
                                <select th:if="${!#lists.isEmpty(orchestratorProfiles)}" id="orchestrator-profile-selector" class="model-select-borderless" title="Multi-agent knowledge base">
                                    <option value="" th:selected="${settings['orchestrator-profile'] == null || settings['orchestrator-profile'] == ''}">Single playbook</option>
                                    <option th:each="pf : ${orchestratorProfiles}"
                                            th:value="${pf}"
                                            th:text="${'🤖 ' + pf}"
                                            th:selected="${settings['orchestrator-profile'] == pf}"></option>
                                </select>
                                <select id="model-selector" name="model" class="model-select-borderless">
                                    <option th:each="modelOpt : ${allowedModels}"
                                            th:value="${modelOpt}"
                                            th:text="${modelOpt}"
                                            th:selected="${settings['model'] == modelOpt}">deepseek/deepseek-v4-pro</option>
                                </select>
                                <select id="thinking-level-selector" name="thinking-level" class="model-select-borderless">
                                    <option value="low" th:selected="${settings['thinking-level'] == 'low'}">Low</option>
                                    <option value="medium" th:selected="${settings['thinking-level'] == null || settings['thinking-level'] == 'medium'}">Medium</option>
                                    <option value="high" th:selected="${settings['thinking-level'] == 'high'}">High</option>
                                </select>
                                <button type="button" id="send-stop-button" class="send-stop-btn">
                                    <svg class="icon-send" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                                        <line x1="12" y1="19" x2="12" y2="5"></line>
                                        <polyline points="5 12 12 5 19 12"></polyline>
                                    </svg>
                                    <svg class="icon-stop" width="16" height="16" viewBox="0 0 24 24" fill="currentColor" style="display: none;">
                                        <rect x="4" y="4" width="16" height="16" rx="2"></rect>
                                    </svg>
                                    <div class="custom-tooltip">Send message</div>
                                </button>
                            </div>
                        </div>
                    </div>
                </form>
            </div>

            <!-- Warning Banner for Read-Only Mode -->
            <div th:if="${isReadOnly}" class="chat-read-only-banner" style="background-color: var(--bg-surface-elevated, #f3f4f6); border: 1px solid var(--border-color, #e5e7eb); padding: 1.25rem 1.5rem; text-align: center; color: var(--text-secondary, #6b7280); font-weight: 500; display: flex; align-items: center; justify-content: center; gap: 0.5rem; border-radius: 8px; margin: 1rem 1.5rem;">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color: var(--color-warning, #f59e0b); flex-shrink: 0;">
                    <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path>
                    <line x1="12" y1="9" x2="12" y2="13"></line>
                    <line x1="12" y1="17" x2="12.01" y2="17"></line>
                </svg>
                <span>This conversation is read-only. You cannot post messages or modify settings.</span>
            </div>
        </div>
    </div>

    <!-- Client-Side Chat Engine -->
    <script th:inline="javascript">
        // Server-provided data for the chat thread UI (consumed by /js/chat/thread.js).
        window.CHAT_CONFIG = {
            conversationId: /*[[${conversation.id}]]*/ 'default-id',
            isReadOnly: /*[[${isReadOnly}]]*/ false,
            prompts: /*[[${prompts}]]*/ [],
            streaming: /*[[${settings['streaming']}]]*/ false,
            showThinking: /*[[${settings['show-thinking']}]]*/ false,
            showPrototypes: /*[[${settings['show-prototypes']}]]*/ false,
            playbookValidationEnabled: /*[[${playbookValidationEnabled}]]*/ false
        };
    </script>
    <script type="module" th:src="@{/js/chat/thread.js}"></script>

    <!-- Citation Modal Dialog -->
    <dialog id="citation-dialog" class="citation-dialog" closedby="any" aria-labelledby="citation-dialog-title">
        <div class="citation-dialog-header">
            <h3 id="citation-dialog-title" class="citation-dialog-title">Citation Source</h3>
            <button class="citation-dialog-close-btn" data-action="close-citation-dialog" title="Close dialog">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="18" y1="6" x2="6" y2="18"></line>
                    <line x1="6" y1="6" x2="18" y2="18"></line>
                </svg>
            </button>
        </div>
        <div id="citation-dialog-content" class="citation-dialog-content">
            <!-- Loaded citation content goes here -->
        </div>
    </dialog>
</body>
</html>
