<div class="citation-expander-card" th:fragment="citation-expander">
    <div th:if="${error != null}" class="citation-error">
        <strong>Error resolving citation:</strong>
        <p th:text="${error}">Error details</p>
    </div>
    
    <div th:if="${section != null}" class="citation-success">
        <div class="citation-expander-header">
            <a th:if="${section.documentTitle != null and section.documentTitle.startsWith('http')}" th:href="${section.documentTitle}" target="_blank" class="citation-source-info" style="color: var(--color-accent); text-decoration: underline;" th:text="${section.documentTitle} + ' (v' + ${section.tag} + ')'"></a>
            <span th:unless="${section.documentTitle != null and section.documentTitle.startsWith('http')}" class="citation-source-info" th:text="${section.documentTitle} + ' (v' + ${section.tag} + ')'">manual_file.md (v9.3)</span>
            <span class="citation-scope-badge" th:text="${section.scope}">this heading only</span>
        </div>
        <div class="citation-expander-body citation-content-md" th:text="${section.text}">Section content...</div>
    </div>
</div>
