apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml
  - database
  - yvoke-app

labels:
  - pairs:
      app.kubernetes.io/managed-by: kustomize
      app.kubernetes.io/part-of: yvoke
      app.kubernetes.io/environment: k3s

# The release this cluster runs, declared rather than computed: `git show <tag>:k8s/app/kustomization.yaml`
# answers "what does this release deploy?" with nothing to run, and `kustomize build k8s/app` is a
# complete deploy from any machine.
#
# Both tags MUST be the same value, and that value MUST equal the git tag of the commit they are
# committed on. This file is a mirror of the tag, never a second source of it: a manifest pinned to
# one version on a commit tagged another deploys a release that was never built.
#
# That agreement is enforced where PUBLISHING happens, not where deploying happens — release.yml
# writes both values from ONE value, and docker-build-publish.yml refuses to push unless the commit
# it is publishing pins the release twice. Do not expect redeploy.sh to catch a hand-edit: it
# publishes nothing and checks no git tag, so its only remaining check is that these two values
# equal each other. Nothing else notices.
#
# These lines are rewritten by .github/workflows/release.yml, which sets both from ONE value and
# commits that immediately before creating the tag. Editing them by hand is not the normal path.
images:
  - name: yvoke/app
    newName: edipal/yvoke-app
    newTag: "1.0.0"
  - name: yvoke/db-migration
    newName: edipal/yvoke-db-migration
    newTag: "1.0.0"
